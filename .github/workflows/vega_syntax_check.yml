name: Vega Dashboard Syntax Check

on:
  push:
    branches: [main]
    paths:
      - 'vega_monitor_v5.py'
      - 'pages/1_Vega_Dashboard.py'
      - '.github/workflows/vega_syntax_check.yml'
  pull_request:
    paths:
      - 'vega_monitor_v5.py'
      - 'pages/1_Vega_Dashboard.py'
      - '.github/workflows/vega_syntax_check.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Vega monitor
        run: python -m py_compile vega_monitor_v5.py pages/1_Vega_Dashboard.py
