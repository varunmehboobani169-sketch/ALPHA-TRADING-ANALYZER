name: FRIDAY Hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch ndarray conversions and syntax-check
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'return j.value.to_numpy()': 'return np.asarray(j.value, dtype=float)',
              'cs=pd.to_numeric(x.atm_straddle,errors="coerce").to_numpy()': 'cs=np.asarray(pd.to_numeric(x.atm_straddle,errors="coerce"), dtype=float)',
              'cp=pd.to_numeric(x.spot,errors="coerce").to_numpy()': 'cp=np.asarray(pd.to_numeric(x.spot,errors="coerce"), dtype=float)',
              'a=pd.to_numeric(s,errors="coerce").to_numpy(float)': 'a=np.asarray(pd.to_numeric(s,errors="coerce"), dtype=float)',
              'sv,yv=s[ok].to_numpy(float),y[ok].to_numpy(float)': 'sv=np.asarray(s[ok], dtype=float); yv=np.asarray(y[ok], dtype=float)',
              'mi_df.loc[good].to_numpy(float)': 'np.asarray(mi_df.loc[good], dtype=float)',
          }
          changed = False
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)
                  changed = True
          p.write_text(s, encoding='utf-8')
          print('patched=', changed)
          PY
          python -m py_compile app.py
      - name: Scan for ndarray-unsafe to_numpy calls
        run: |
          if grep -n "pd.to_numeric.*to_numpy\|j.value.to_numpy\|y\[ok\].to_numpy" app.py; then
            echo 'Unsafe conversion pattern remains.'
            exit 1
          fi
      - name: Commit hotfix if needed
        run: |
          if git diff --quiet -- app.py; then
            echo 'No hotfix changes needed.'
            exit 0
          fi
          git config user.name 'FRIDAY Hotfix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.py
          git commit -m 'Harden ndarray handling in FRIDAY'
          git push
