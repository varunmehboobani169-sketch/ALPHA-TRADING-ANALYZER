name: FRIDAY Quarter Guard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quarter-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch quarter diagnostics and validate syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')

          old = '''def run_quarter(q,o,s,v):\n    oq,sq,vq=qslice(o,q),qslice(s,q),qslice(v,q)\n    if o.empty or s.empty or v.empty: raise ValueError(f"{q}: Options, Spot and VIX are all required.")'''
          new = '''def run_quarter(q,o,s,v):\n    oq,sq,vq=qslice(o,q),qslice(s,q),qslice(v,q)\n    missing=[]\n    if oq.empty: missing.append(f"Options (uploaded range: {range_text(o)})")\n    if sq.empty: missing.append(f"Spot (uploaded range: {range_text(s)})")\n    if vq.empty: missing.append(f"India VIX (uploaded range: {range_text(v)})")\n    if missing:\n        raise ValueError(f"{q}: no rows after quarter filter for {', '.join(missing)}. Upload the corresponding quarter data or a full-period file containing {q}.")'''

          if old in s:
              s = s.replace(old, new)
          else:
              print('run_quarter block already patched or changed; leaving it intact')

          marker='''    bar=st.progress(0,text="FRIDAY: 0% — loading"); start=time.time(); o=normalize_options(read_csvs(opt)); s=normalize_market(read_csvs(spot),"NIFTY Spot"); v=normalize_market(read_csvs(vix),"India VIX")\n'''
          addition='''    bar=st.progress(0,text="FRIDAY: 0% — loading"); start=time.time(); o=normalize_options(read_csvs(opt)); s=normalize_market(read_csvs(spot),"NIFTY Spot"); v=normalize_market(read_csvs(vix),"India VIX")\n    st.markdown("### PRE-FLIGHT DATA CHECK")\n    pre=[]\n    for q in selected:\n        oq,sq,vq=qslice(o,q),qslice(s,q),qslice(v,q)\n        pre.extend([\n            {"quarter":q,"source":"Options","rows":len(oq),"range":range_text(oq),"status":"OK" if not oq.empty else "MISSING"},\n            {"quarter":q,"source":"Spot","rows":len(sq),"range":range_text(sq),"status":"OK" if not sq.empty else "MISSING"},\n            {"quarter":q,"source":"India VIX","rows":len(vq),"range":range_text(vq),"status":"OK" if not vq.empty else "MISSING"},\n        ])\n    st.dataframe(pd.DataFrame(pre),use_container_width=True,hide_index=True)\n'''
          if marker in s and addition not in s:
              s=s.replace(marker,addition)

          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile app.py
      - name: Commit patch
        run: |
          if git diff --quiet -- app.py; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'FRIDAY Quarter Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add app.py
          git commit -m 'Add quarter preflight diagnostics'
          git push
